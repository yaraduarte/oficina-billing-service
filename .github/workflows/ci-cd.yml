name: CI/CD Pipeline

# Fluxo de branches:
#   feature/*  --PR-->  homolog  (deploy automático em HOMOLOGAÇÃO, namespace oficina-hml)
#   homolog    --PR-->  main     (deploy automático em PRODUÇÃO, namespace oficina-marimb0ndo)
# main e homolog são protegidas: merge só via PR com o check "Testes" verde.

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_IMAGE: yaraduarte/oficina-billing-service

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Testes (cobertura mínima de 80%)
        run: npm run test:ci
      - name: Resumo da cobertura
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total; const r=k=>t[k].pct+'%';
          console.log('| Métrica | Cobertura |\n|---|---|\n| Statements | '+r('statements')+' |\n| Branches | '+r('branches')+' |\n| Funções | '+r('functions')+' |\n| Linhas | '+r('lines')+' |')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build-and-push:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "image=${DOCKER_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tags=${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${DOCKER_IMAGE}:hml-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "tags=${DOCKER_IMAGE}:hml-latest,${DOCKER_IMAGE}:hml-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tags }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    env:
      NAMESPACE: ${{ github.ref_name == 'main' && 'oficina-marimb0ndo' || 'oficina-hml' }}
    steps:
      - uses: actions/checkout@v4
      - name: Copiar manifesto e script para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ec2-user
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          source: "k8s/billing.yaml,scripts/deploy.sh"
          target: /tmp/billing-service
      - name: Aplicar no k3s
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          NAMESPACE: ${{ env.NAMESPACE }}
          APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
          MERCADO_PAGO_NOTIFICATION_URL: ${{ vars.MERCADO_PAGO_NOTIFICATION_URL }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        with:
          host: ${{ secrets.K3S_HOST }}
          username: ec2-user
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          envs: IMAGE,NAMESPACE,APP_ENV,MERCADO_PAGO_ACCESS_TOKEN,MERCADO_PAGO_WEBHOOK_SECRET,MERCADO_PAGO_NOTIFICATION_URL,NEW_RELIC_LICENSE_KEY
          script: |
            bash /tmp/billing-service/scripts/deploy.sh "$NAMESPACE" "$IMAGE" /tmp/billing-service/k8s/billing.yaml
